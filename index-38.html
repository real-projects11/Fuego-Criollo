<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuego Criollo — Parrilla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #17130f;
    --cream: #f4ece1;
    --ember: #ff5a2b;
    --ember-deep: #c6401e;
    --smoke: #a89a8a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Manrope', sans-serif;
    background: var(--ink);
    color: var(--cream);
  }

  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  .hero-video {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 38%;
    transform: translate(-50%, -50%);
  }

  .hero-scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      340deg,
      rgba(8, 6, 5, 0.9) 0%,
      rgba(8, 6, 5, 0.55) 22%,
      rgba(8, 6, 5, 0.15) 40%,
      rgba(8, 6, 5, 0) 58%
    );
  }

  .hero-nav {
    position: absolute;
    top: 18px;
    left: 16px;
    right: 16px;
    z-index: 2;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
    padding: 13px 18px;
    border: 1px solid rgba(255, 255, 255, 0.55);
    border-radius: 999px;
    background: transparent;
  }

  .nav-link {
    color: rgba(255, 255, 255, 0.92);
    text-decoration: none;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: clamp(0.6rem, 2.3vw, 0.72rem);
    font-weight: 400;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }

  .nav-group {
    display: flex;
    align-items: center;
    gap: clamp(14px, 4.5vw, 24px);
  }

  .nav-left { justify-content: flex-end; }
  .nav-right { justify-content: flex-start; }

  .nav-center {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .nav-logo {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    font-size: clamp(0.62rem, 2.8vw, 0.75rem);
    line-height: 0.9;
    letter-spacing: 0.015em;
    color: #ffffff;
    text-align: center;
    white-space: nowrap;
  }

  .nav-divider {
    width: 1px;
    height: 24px;
    background: rgba(255, 255, 255, 0.4);
  }

  @media (min-width: 900px) {
    .hero-nav { top: 28px; left: 40px; right: 40px; padding: 16px 30px; gap: 24px; }
    .nav-link { font-size: 0.85rem; }
    .nav-group { gap: 32px; }
    .nav-center { gap: 22px; }
    .nav-divider { height: 34px; }
    .nav-logo { font-size: 1.15rem; }
  }

  .hero-content {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
    padding: 22px 20px 28px;
    z-index: 1;
  }

  .brand {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    line-height: 0.95;
    letter-spacing: 0.01em;
    font-size: clamp(2rem, 6.8vw, 2.7rem);
    color: #ffffff;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
  }

  .brand .fuego,
  .brand .criollo { color: #ffffff; }

  .tagline {
    margin-top: 8px;
    font-size: clamp(0.72rem, 2.3vw, 0.85rem);
    color: rgba(255, 255, 255, 0.88);
    font-weight: 500;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
  }

  .tagline span {
    padding: 0 7px;
    color: #ffffff;
  }

  .tagline span:first-child { padding-left: 0; }

  .tagline span:not(:last-child) {
    border-right: 1px solid rgba(255, 255, 255, 0.3);
  }

  .cta {
    margin-top: 18px;
    display: block;
    width: 100%;
    text-align: center;
    padding: 17px 22px;
    background: #ffffff;
    color: #111111;
    font-weight: 700;
    font-size: 0.95rem;
    text-decoration: none;
    border-radius: 6px;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  @media (min-width: 900px) {
    .brand { font-size: clamp(2.3rem, 4.4vw, 3.2rem); }
    .tagline { font-size: 0.85rem; margin-top: 10px; }
    .cta { margin-top: 24px; display: inline-block; width: auto; padding: 15px 34px; font-size: 1rem; }
  }

  .cta:hover {
    background: #111111;
    color: #ffffff;
    transform: translateY(-2px);
  }

  @media (prefers-reduced-motion: reduce) {
    .cta { transition: none; }
  }
</style>
</head>
<body>

<section class="hero">
  <video class="hero-video" autoplay muted playsinline>
    <source src="fuego-criollo.mp4" type="video/mp4">
  </video>
  <div class="hero-scrim"></div>
  <nav class="hero-nav">
    <div class="nav-group nav-left">
      <a href="#" class="nav-link">Inicio</a>
      <a href="#" class="nav-link">Menú</a>
    </div>
    <div class="nav-center">
      <span class="nav-divider"></span>
      <span class="nav-logo">FUEGO<br>CRIOLLO</span>
      <span class="nav-divider"></span>
    </div>
    <div class="nav-group nav-right">
      <a href="#" class="nav-link">Mapa</a>
      <a href="#" class="nav-link">Contacto</a>
    </div>
  </nav>
  <div class="hero-content">
    <h1 class="brand"><span class="fuego">A PURO</span><br><span class="criollo">FUEGO</span></h1>
    <p class="tagline">El sabor de las brasas, en cada bocado</p>
    <a href="#" class="cta">Ver el menú</a>
  </div>
</section>

</body>
</html>
