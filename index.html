<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuego Criollo — Parrilla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #17130f;
    --cream: #f4ece1;
    --ember: #ff5a2b;
    --ember-deep: #c6401e;
    --smoke: #a89a8a;
    --silver: #e6e4df;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--ink);
    color: var(--cream);
  }

  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  .hero-video {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 38%;
    transform: translate(-50%, -50%);
  }

  .hero-scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      340deg,
      rgba(8, 6, 5, 0.9) 0%,
      rgba(8, 6, 5, 0.55) 22%,
      rgba(8, 6, 5, 0.15) 40%,
      rgba(8, 6, 5, 0) 58%
    );
  }

  .hero-vignette-top {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 140px;
    background: linear-gradient(to bottom, rgba(6, 5, 4, 0.75) 0%, rgba(6, 5, 4, 0) 100%);
    z-index: 1;
    pointer-events: none;
  }

  .hero-vignette-bottom {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 46%;
    background: linear-gradient(to top, rgba(4, 3, 2, 0.92) 0%, rgba(4, 3, 2, 0.55) 40%, rgba(4, 3, 2, 0) 100%);
    z-index: 1;
    pointer-events: none;
  }

  @media (min-width: 900px) {
    .hero-vignette-top { height: 180px; }
    .hero-vignette-bottom { height: 40%; }
  }

  /* === INICIO REDISEÑO BARRA DE NAVEGACIÓN === */
  .hero-nav {
    position: absolute;
    top: 18px;
    left: 16px;
    right: 16px;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    border: 1px solid rgba(255, 255, 255, 0.55);
    border-radius: 999px;
    background: transparent;
  }

  .nav-side {
    display: flex;
    flex: 1; 
    align-items: center;
    justify-content: space-evenly;
  }

  .nav-center {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 3vw, 24px);
    flex-shrink: 0;
  }

  .nav-link {
    color: var(--silver);
    text-decoration: none;
    font-family: 'Outfit', sans-serif;
    font-size: clamp(0.62rem, 2.3vw, 0.74rem);
    font-weight: 300;
    letter-spacing: 0.06em;
    white-space: nowrap;
    opacity: 0.92;
    transition: opacity 0.15s ease;
  }

  .nav-link:hover { opacity: 1; }

  .nav-logo {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    font-size: clamp(0.66rem, 2.8vw, 0.8rem);
    line-height: 1.15;
    letter-spacing: 0.08em;
    color: #ffffff;
    text-align: center;
    white-space: nowrap;
  }

  .nav-divider {
    width: 1px;
    height: 26px;
    background: rgba(230, 228, 223, 0.35);
  }

  @media (min-width: 900px) {
    .hero-nav { top: 28px; left: 40px; right: 40px; padding: 10px 34px; }
    .nav-link { font-size: 0.85rem; }
    .nav-divider { height: 34px; }
    .nav-logo { font-size: 1.15rem; }
  }
  /* === FIN REDISEÑO BARRA DE NAVEGACIÓN === */

  .hero-content {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
    padding: 22px 20px 28px;
    z-index: 2;
  }

  .brand {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    line-height: 0.95;
    letter-spacing: 0.01em;
    font-size: clamp(2rem, 6.8vw, 2.7rem);
    color: #ffffff;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
  }

  .brand .fuego,
  .brand .criollo { color: #ffffff; }

  .tagline {
    margin-top: 8px;
    font-size: clamp(0.72rem, 2.3vw, 0.85rem);
    color: rgba(255, 255, 255, 0.88);
    font-weight: 500;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
  }

  .tagline span {
    padding: 0 7px;
    color: #ffffff;
  }

  .tagline span:first-child { padding-left: 0; }

  .tagline span:not(:last-child) {
    border-right: 1px solid rgba(255, 255, 255, 0.3);
  }

  .cta {
    margin-top: 18px;
    display: block;
    width: 100%;
    text-align: center;
    padding: 17px 22px;
    background: #ffffff;
    color: #111111;
    font-weight: 700;
    font-size: 0.95rem;
    text-decoration: none;
    border-radius: 6px;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  @media (min-width: 900px) {
    .brand { font-size: clamp(2.3rem, 4.4vw, 3.2rem); }
    .tagline { font-size: 0.85rem; margin-top: 10px; }
    .cta { margin-top: 24px; display: inline-block; width: auto; padding: 15px 34px; font-size: 1rem; }
  }

  .cta:hover {
    background: #111111;
    color: #ffffff;
    transform: translateY(-2px);
  }

  @media (prefers-reduced-motion: reduce) {
    .cta { transition: none; }
  }
</style>
</head>
<body>

<section class="hero">
  <video class="hero-video" autoplay muted playsinline>
    <source src="fuego-criollo.mp4" type="video/mp4">
  </video>
  <div class="hero-scrim"></div>
  <div class="hero-vignette-top"></div>
  <div class="hero-vignette-bottom"></div>
  
  <nav class="hero-nav">
    <div class="nav-side">
      <a href="#" class="nav-link">Inicio</a>
      <a href="#" class="nav-link">Menú</a>
    </div>
    <div class="nav-center">
      <span class="nav-divider"></span>
      <span class="nav-logo">FUEGO<br>CRIOLLO</span>
      <span class="nav-divider"></span>
    </div>
    <div class="nav-side">
      <a href="#" class="nav-link">Mapa</a>
      <a href="#" class="nav-link">Contacto</a>
    </div>
  </nav>

  <div class="hero-content">
    <h1 class="brand"><span class="fuego">A PURO</span><br><span class="criollo">FUEGO</span></h1>
    <p class="tagline">El sabor de las brasas, en cada bocado</p>
    <a href="#" class="cta">Ver el menú</a>
  </div>
</section>

</body>
</html>
