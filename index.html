<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuego Criollo — Parrilla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #17130f;
    --cream: #f4ece1;
    --ember: #ff5a2b;
    --ember-deep: #c6401e;
    --smoke: #a89a8a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Manrope', sans-serif;
    background: var(--ink);
    color: var(--cream);
  }

  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  .hero-video {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 40%;
    transform: translate(-50%, -50%);
  }

  .hero-scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to top,
      rgba(10, 8, 6, 0.92) 0%,
      rgba(10, 8, 6, 0.55) 30%,
      rgba(10, 8, 6, 0.05) 55%,
      rgba(10, 8, 6, 0.35) 100%
    );
  }

  .hero-content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    text-align: center;
    padding: 0 24px 64px;
    z-index: 1;
  }

  .brand {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    line-height: 0.95;
    letter-spacing: 0.01em;
    font-size: clamp(2.6rem, 11vw, 5.2rem);
  }

  .brand .fuego { color: var(--cream); }
  .brand .criollo { color: var(--ember); }

  .tagline {
    margin-top: 14px;
    font-size: clamp(0.85rem, 2.4vw, 1.05rem);
    color: var(--smoke);
    font-weight: 500;
  }

  .tagline span {
    padding: 0 10px;
    color: var(--cream);
  }

  .tagline span:not(:last-child) {
    border-right: 1px solid rgba(244, 236, 225, 0.25);
  }

  .cta {
    margin-top: 32px;
    display: inline-block;
    padding: 14px 34px;
    background: var(--ember);
    color: var(--ink);
    font-weight: 700;
    font-size: 0.95rem;
    text-decoration: none;
    border-radius: 3px;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .cta:hover {
    background: var(--ember-deep);
    color: var(--cream);
    transform: translateY(-2px);
  }

  @media (prefers-reduced-motion: reduce) {
    .cta { transition: none; }
  }
</style>
</head>
<body>

<section class="hero">
  <video class="hero-video" autoplay loop muted playsinline>
    <source src="fuego-criollo.mp4" type="video/mp4">
  </video>
  <div class="hero-scrim"></div>
  <div class="hero-content">
    <h1 class="brand"><span class="fuego">FUEGO</span> <span class="criollo">CRIOLLO</span></h1>
    <p class="tagline">
      <span>Parrilla</span><span>Empanadas</span><span>Comidas caseras</span>
    </p>
    <a href="#" class="cta">Ver el menú</a>
  </div>
</section>

</body>
</html>
